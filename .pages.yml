# .pages.yml
# 已修复缩进，确保 content 被识别为数组

media:
  - name: images
    input: public/images
    output: /images

content:
  - name: posts
    label: 文章
    type: collection
    path: blog
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    fields:
      - name: slug
        label: Slug (URL标识)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "只能包含小写字母、数字和连字符"

      - name: title
        label: 文章标题
        type: string
        required: true

      - name: date
        label: 日期
        type: date
        required: true

      - name: category
        label: 分类
        type: select
        default: technology
        options:
          - label: 技术
            value: technology
          - label: 日记
            value: diary
          - label: 杂碎
            value: something
          - label: 友链
            value: friend_link
        required: true

      - name: excerpt
        label: 文章简介
        type: text
        required: true
        options:
          minlength: 10
          maxlength: 200

      - name: tags
        label: 标签
        type: list
        field:
          type: string
        description: "输入标签后按回车添加"

      - name: license
        label: 正文协议
        type: select
        default: "保留所有权利"
        options:
          - label: "保留所有权利"
            value: "保留所有权利"
          - label: "CC BY 4.0"
            value: "CC BY"
          - label: "CC BY-SA 4.0"
            value: "CC BY-SA"
          - label: "CC BY-NC 4.0"
            value: "CC BY-NC"
          - label: "CC BY-ND 4.0"
            value: "CC BY-ND"
          - label: "CC BY-NC-SA 4.0"
            value: "CC BY-NC-SA"
          - label: "CC BY-NC-ND 4.0"
            value: "CC BY-NC-ND"
          - label: "CC0 1.0 (公有领域)"
            value: "CC0"
        required: true

      - name: code-license
        label: 代码协议（可选）
        type: select
        default: "none"
        options:
          - label: "不设置"
            value: "none"
          - label: "MIT"
            value: "MIT"
          - label: "Apache 2.0"
            value: "Apache 2.0"
          - label: "GPL"
            value: "GPL"
        required: false

      - name: body
        label: 文章正文
        type: rich-text
        required: true